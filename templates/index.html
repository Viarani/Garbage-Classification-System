<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garbage Classifier - AI Vision</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { 
            color: #4ade80; 
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3); 
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 2.5rem; 
        }
        
        .instruction {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* KAMERA */
        .camera-container {
            position: relative; 
            border: 6px solid #4ade80; 
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0px 0px 30px rgba(74, 222, 128, 0.4);
            background-color: #000;
            width: 85vw; 
            max-width: 1000px; 
            aspect-ratio: 4 / 3; 
        }

        .camera-container img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* GRAFIK */
        .chart-overlay {
            position: absolute; 
            top: 20px;      
            right: 20px;    
            width: 220px;
            height: 200px;
            background-color: rgba(30, 30, 47, 0.85); 
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 10;     
            pointer-events: none; 
            padding: 10px; 
        }
    </style>
</head>
<body>

    <h1>♻️ Garbage Classification</h1>
    <p class="instruction">Arahkan sampah ke depan kamera. AI akan menebak secara otomatis!</p>

    <div class="camera-container">
        <img src="{{ url_for('video_feed') }}" alt="Kamera Live">

        <div class="chart-overlay">
            <canvas id="wasteMinimap"></canvas>
        </div>
    </div>

    <script>
        Chart.register(ChartDataLabels);
        let myChart;

        function updateChart() {
            fetch('/chart_data')
                .then(response => response.json())
                .then(data => {
                    const ctx = document.getElementById('wasteMinimap').getContext('2d');
                    
                    if (myChart) {
                        myChart.data.labels = data.labels;
                        myChart.data.datasets[0].data = data.values;
                        myChart.update('none'); 
                    } else {
                        myChart = new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: data.labels,
                                datasets: [{
                                    data: data.values,
                                    backgroundColor: [
                                        '#8d6e63', '#4fc3f7', '#94a3b8', 
                                        '#fef08a', '#4ade80', '#f87171'
                                    ],
                                    borderColor: '#1e1e2f',
                                    borderWidth: 1.5
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                cutout: '55%', 
                                layout: {
                                    padding: 40
                                },
                                plugins: {
                                    legend: { display: false }, 
                                    tooltip: { enabled: true }, 
                                    
                                    datalabels: {
                                        display: 'auto',
                                        color: '#ffffff',
                                        font: { weight: 'bold', size: 10 },
                                        textAlign: 'center',
                                        formatter: (value, context) => {
                                            // Persentase label
                                            let dataArr = context.chart.data.datasets[0].data;
                                            let total = dataArr.reduce((a, b) => a + b, 0);
                                            
                                            if (total === 0 || value === 0) return '';
                                            let percentage = Math.round((value / total) * 100);
                                            let labelName = context.chart.data.labels[context.dataIndex];
                                            return labelName + '\n' + percentage + '%';
                                        },
                                        anchor: 'end',
                                        align: 'end',
                                        offset: 5 
                                    }
                                }
                            }
                        });
                    }
                });
        }

        updateChart();
        setInterval(updateChart, 2000);
    </script>
</body>
</html>
